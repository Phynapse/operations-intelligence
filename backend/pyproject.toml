[project]
name = "operations-intelligence-backend"
version = "0.1.0"
description = "Operations Intelligence - deterministic operational analytics and LLM-grounded explanation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.27,<1.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "unit: isolated unit tests",
    "integration: tests that exercise API and service wiring",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "app/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = []
exclude = ["^\\.venv", "^data"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pandas_stubs.*"]
ignore_missing_imports = true
